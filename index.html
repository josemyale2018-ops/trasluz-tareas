<body>
    <div id="loginScreen" class="login-screen">

            <div class="logo">
                <div class="logo-icon">🍽️</div>

                <p>El Trasluz Sevilla</p>
            </div>
            <form class="login-form" onsubmit="handleLogin(event)">
                <div class="input-group">
                    <label>Usuario</label>
                    <input type="text" id="username" placeholder="ej: andriek" required>
                </div>
                <div class="input-group">
                    <label>Contraseña</label>
                    <input type="password" id="password" placeholder="••••••" required>
                </div>
                <button type="submit" class="login-btn">Entrar</button>
                <div class="error" id="error"></div>
            </form>
        </div>
    </div>

    <div id="fechaScreen" class="fecha-screen">
        <div class="fecha-card">
            <div class="fecha-title">Selecciona una Fecha</div>

                <input type="date" id="fechaInput" min="2026-06-29" max="2026-07-05">

            <div style="display: flex; gap: 10px;">

                <button class="btn-back" onclick="volverAlLogin()" style="flex: 1;">Volver</button>
            </div>
        </div>
    </div>

    <div id="selectorScreen" class="selector-screen">

            <div id="selectorsContainer"></div>

                <button class="btn-continue" id="continueBtn" onclick="goToApp()" disabled>Continuar</button>
            </div>
        </div>
    </div>

                        <div class="standard-image"><a href="https://ibb.co/0jYFwBx8" target="_blank"><img src="https://i.ibb.co/VWMQKHsr/Whats-App-Image-2026-06-12-at-11-02-04.jpg" alt="Estándares"></a></div>

        function submitTasks() { const info = camareros[usuarioActual]; const fecha = new Date(2026, 5, fechaSeleccionada); const fechaFormato = fecha.toLocaleDateString('es-ES', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' }); const turnosTexto = Object.keys(turnosDeHoy).map(t => t.charAt(0).toUpperCase() + t.slice(1)).join(', '); const puestosTexto = Object.entries(puestosPorTurno).map(([t, p]) => `${t}: ${p === 'barra_sala' ? 'Barra y Sala' : p === 'barra' ? 'Barra' : p === 'sala' ? 'Sala' : 'Cocina'}`).join(' | '); let tareasRealizadas = []; let tareasProf = []; document.querySelectorAll('.task-item.completed').forEach(item => { const titulo = item.querySelector('.task-title').textContent; if (item.parentElement.classList.contains('profundas-section') || item.closest('.profundas-section')) { tareasProf.push(titulo); } else { tareasRealizadas.push(titulo); } }); let emailBody = `TAREAS COMPLETADAS - ${info.nombre}\n\n${fechaFormato}\nTurnos: ${turnosTexto}\nPuestos: ${puestosTexto}\n\n`; if (tareasRealizadas.length > 0) { emailBody += `ANTES DE FINALIZAR EL SERVICIO:\n`; tareasRealizadas.forEach(t => { emailBody += `- ${t}\n`; }); } if (tareasProf.length > 0) { emailBody += `\nLIMPIEZA PROFUNDA:\n`; tareasProf.forEach(t => { emailBody += `- ${t}\n`; }); } const datos = { accion: "enviarTareas", camarero: info.nombre, turnos: turnosTexto, puestos: puestosTexto, emailBody: emailBody, tareasRealizadas: tareasRealizadas.length, tareasProf: tareasProf.length }; fetch(APPS_SCRIPT_URL, { method: 'POST', body: JSON.stringify(datos) }).then(response => response.json()).then(data => { if (data.status === 'success') { alert(`TAREAS ENVIADAS\n\n${info.nombre}\n\nTareas de limpieza: ${tareasRealizadas.length}\nTareas profundas: ${tareasProf.length}\n\nEmail enviado a: josemyale2018@gmail.com`); } else { alert(`Error: ${data.message}`); } }).catch(error => { alert(`Error al enviar: ${error}`); }); }
        function submitIncidencia(event) { event.preventDefault(); const camareroKey = document.getElementById('incidenciaCamarero').value; const turno = document.getElementById('incidenciaTurno').value; const descripcion = document.getElementById('incidenciaDesc').value; if (!camareroKey || !turno || !descripcion) { alert('Por favor completa todos los campos'); return; } const supervisor = camareros[usuarioActual].nombre; const camarero = camareros[camareroKey].nombre; const fecha = new Date(2026, 5, fechaSeleccionada); const fechaFormato = fecha.toLocaleDateString('es-ES', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' }); const emailBody = `INCIDENCIA REGISTRADA\n\nSupervisor: ${supervisor}\nCamarero: ${camarero}\nTurno: ${turno.charAt(0).toUpperCase() + turno.slice(1)}\nFecha: ${fechaFormato}\n\nDescripcion:\n${descripcion}`; const datos = { accion: "registrarIncidencia", supervisor: supervisor, camarero: camarero, turno: turno, descripcion: descripcion, emailBody: emailBody }; fetch(APPS_SCRIPT_URL, { method: 'POST', body: JSON.stringify(datos) }).then(response => response.json()).then(data => { if (data.status === 'success') { alert(`INCIDENCIA REGISTRADA\n\nCamarero: ${camarero}\nTurno: ${turno}\nDescripcion: ${descripcion}\n\nEmail enviado a: josemyale2018@gmail.com`); document.getElementById('incidenciaDesc').value = ''; document.getElementById('incidenciaCamarero').value = ''; document.getElementById('incidenciaTurno').value = ''; } else { alert(`Error: ${data.message}`); } }).catch(error => { alert(`Error al registrar: ${error}`); }); }
        function changeFecha() { puestosPorTurno = {}; document.getElementById('appScreen').style.display = 'none'; document.getElementById('fechaScreen').style.display = 'flex'; mostrarInfoFecha(); }
        function changePuesto() { puestosPorTurno = {}; document.getElementById('appScreen').style.display = 'none'; document.getElementById('selectorScreen').style.display = 'flex'; document.getElementById('continueBtn').disabled = true; const container = document.getElementById('selectorsContainer'); const buttons = container.querySelectorAll('.btn-option'); buttons.forEach(btn => btn.classList.remove('selected')); }
        function volverAFecha() { puestosPorTurno = {}; document.getElementById('selectorScreen').style.display = 'none'; document.getElementById('fechaScreen').style.display = 'flex'; }
        function volverAlLogin() { fechaSeleccionada = null; document.getElementById('fechaScreen').style.display = 'none'; document.getElementById('loginScreen').style.display = 'flex'; document.getElementById('username').value = ''; document.getElementById('password').value = ''; }
        function logout() { document.getElementById('appScreen').style.display = 'none'; document.getElementById('loginScreen').style.display = 'flex'; document.getElementById('username').value = ''; document.getElementById('password').value = ''; usuarioActual = null; fechaSeleccionada = null; turnosDeHoy = {}; puestosPorTurno = {}; tareasCompletadas = {}; }
        document.getElementById('fechaInput').addEventListener('change', mostrarInfoFecha);
    </script>
